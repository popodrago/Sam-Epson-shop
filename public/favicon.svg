<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGradFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF8D6"/>
      <stop offset="75%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E6C200"/>
    </linearGradient>
    <linearGradient id="goldDarkFav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7B1C"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#6B530B"/>
    </linearGradient>
    <linearGradient id="goldLightFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6CC"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B88A14"/>
    </linearGradient>
  </defs>

  {/* Outer Dark Background Tile */}
  <rect width="100" height="100" rx="20" fill="#0A0A0E"/>

  {/* Paper Feeder (Top) */}
  <rect x="34" y="6" width="32" height="28" rx="1" fill="url(#goldGradFav)"/>
  <path d="M22 18 h56 v16 H22 z" fill="url(#goldDarkFav)" opacity="0.85"/>
  <rect x="31" y="10" width="38" height="22" rx="1.5" fill="url(#goldGradFav)"/>

  {/* Main Body Upper Section */}
  <rect x="8" y="30" width="84" height="22" rx="9" fill="url(#goldGradFav)"/>

  {/* Control Panel Buttons & LCD Screen */}
  <rect x="16" y="37" width="6.5" height="6.5" rx="1" fill="#0A0A0E"/>
  <circle cx="30" cy="40.25" r="3.25" fill="#0A0A0E"/>
  <circle cx="41" cy="40.25" r="3.25" fill="#0A0A0E"/>
  <rect x="60" y="37" width="16" height="6.5" rx="1.5" fill="#0A0A0E"/>

  {/* Black Banner Bar Across Center */}
  <rect x="8" y="49" width="84" height="16" fill="#0A0A0E"/>
  
  {/* SAM EPSON Brand Typography */}
  <text x="50" y="60.5" text-anchor="middle" fill="url(#goldGradFav)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="8.8" letter-spacing="0.8">SAM EPSON</text>

  {/* Main Body Lower Section */}
  <path d="M8 65 h84 v6 c0 6 -4.5 10 -10 10 H18 c-5.5 0 -10 -4 -10 -10 v-6 z" fill="url(#goldGradFav)"/>

  {/* Printed Paper Output Tray (Trapezoid) */}
  <path d="M26 65 h48 l8 25 H18 z" fill="url(#goldLightFav)"/>

  {/* Tagline */}
  <text x="50" y="97" text-anchor="middle" fill="url(#goldGradFav)" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="4.2" letter-spacing="0.3">Engineered to endure</text>
</svg>
