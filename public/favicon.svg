<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#FFF8D6"/>
      <stop offset="85%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#E6C200"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6D14"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#5E4705"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#B88A14"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Tile Base -->
  <rect width="128" height="128" rx="28" fill="#0A0A0E"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.6"/>

  <!-- Paper Feeder Slot (Top) -->
  <rect x="42" y="10" width="44" height="34" rx="3" fill="url(#goldGrad)"/>
  <path d="M28 26 h72 v18 H28 z" fill="url(#goldDark)" opacity="0.9"/>
  <rect x="38" y="16" width="52" height="26" rx="2" fill="url(#goldGrad)"/>

  <!-- Main Body Upper Section -->
  <rect x="10" y="40" width="108" height="28" rx="12" fill="url(#goldGrad)"/>

  <!-- Control Buttons & Screen -->
  <rect x="20" y="49" width="8" height="8" rx="2" fill="#0A0A0E"/>
  <circle cx="38" cy="53" r="4" fill="#0A0A0E"/>
  <circle cx="52" cy="53" r="4" fill="#0A0A0E"/>
  <rect x="76" y="49" width="22" height="8" rx="2" fill="#0A0A0E"/>

  <!-- Black Banner Bar Across Center -->
  <rect x="10" y="64" width="108" height="20" fill="#0A0A0E"/>

  <!-- SAM EPSON Brand Typography -->
  <text x="64" y="78.5" text-anchor="middle" fill="url(#goldGrad)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="11.5" letter-spacing="1">SAM EPSON</text>

  <!-- Main Body Lower Section -->
  <path d="M10 84 h108 v6 c0 8 -6 14 -14 14 H24 c-8 0 -14 -6 -14 -14 v-6 z" fill="url(#goldGrad)"/>

  <!-- Printed Paper Output Tray -->
  <path d="M34 84 h60 l10 32 H24 z" fill="url(#goldLight)"/>

  <!-- Tagline -->
  <text x="64" y="123" text-anchor="middle" fill="url(#goldGrad)" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="5.5" letter-spacing="0.4">Engineered to endure</text>
</svg>
